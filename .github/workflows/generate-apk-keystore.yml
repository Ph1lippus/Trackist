name: Generate APK signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        run: |
          KEYSTORE_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 24)
          keytool -genkeypair -v \
            -alias track1st \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Track1st, OU=Track1st, O=Track1st, L=Lisbon, ST=Lisboa, C=PT"
          base64 -w0 release-keystore.jks > keystore.b64
          echo "KEYSTORE_PASS=$KEYSTORE_PASS"
          sha256sum keystore.b64

      - name: Upload keystore base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64