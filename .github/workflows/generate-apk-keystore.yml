name: Generate APK signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check keystore password secret exists
        env:
          KEYSTORE_PASS: ${{ secrets.TRACK1ST_KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::TRACK1ST_KEYSTORE_PASS secret is not set. Add it first (Settings -> Secrets and variables -> Actions), then re-run this workflow."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Generate keystore
        env:
          KEYSTORE_PASS: ${{ secrets.TRACK1ST_KEYSTORE_PASS }}
        run: |
          keytool -genkeypair -v \
            -alias track1st \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -keystore release-keystore.jks \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=Track1st, OU=Track1st, O=Track1st, L=Lisbon, ST=Lisboa, C=PT"
          base64 -w0 release-keystore.jks > keystore.b64
          SHA1=$(keytool -list -v -keystore release-keystore.jks -storepass "$KEYSTORE_PASS" -alias track1st 2>/dev/null | grep -i 'SHA1:' | head -1 | sed 's/.*SHA1: //')
          echo "Signing certificate SHA-1 (use in Google API key restriction):"
          echo "SHA1=$SHA1"
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          sha256sum keystore.b64

      - name: Upload keystore base64
        uses: actions/upload-artifact@v4
        with:
          name: keystore-b64
          path: keystore.b64