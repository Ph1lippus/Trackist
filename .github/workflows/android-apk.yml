name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check google-services.json present
        run: |
          test -f android/app/google-services.json || { echo "::error::android/app/google-services.json is missing - download it from Firebase and commit it"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; fi

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Setup .env for web build
        run: |
          tee .env >/dev/null <<'EOF'
          VITE_SUPABASE_URL=https://iqlzdmjamsvxinqbrnix.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_FtPjRxIb-H4GkM6u6ZX3JA_ZoiMV579
          VITE_TMDB_API_KEY=937ec79683c0989bab356844c93f8d2e
          VITE_HCAPTCHA_ENABLED=true
          VITE_HCAPTCHA_SITE_KEY=00a4a032-68c6-4600-8bbe-ff3a7bbcb7cc
          VITE_HIBP_ENABLED=true
          VITE_MFA_ENABLED=true
          VITE_PUSH_VAPID_PUBLIC_KEY=BEssU3Bgw1_Vky5PeIPOjPRESLb1orCsxycdUsZTM7Ve0nxeNcpaZQnjRURkrgIAYLquu4Am0vSPEkBZfEfFrCM
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Stamp version
        env:
          VERSION: 1.2.${{ github.run_number }}
        run: |
          export VERSION="1.2.${{ github.run_number }}"
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION']
          app_gradle = Path('android/app/build.gradle')
          text = app_gradle.read_text()
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', text)
          version_code = 1200 + int(os.environ['GITHUB_RUN_NUMBER'])
          text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text)
          app_gradle.write_text(text)
          PY

      - name: Ensure stable signing key
        run: |
          if [ ! -f android/app/upload.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/upload.keystore \
              -storetype JKS \
              -alias track1st \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass track1st-2026 -keypass track1st-2026 \
              -dname "CN=Track1st, OU=Track1st, O=Track1st, L=Lisbon, ST=Lisbon, C=PT" 2>/dev/null
            git config user.email "actions@github.com"
            git config user.name "GitHub Actions"
            git add android/app/upload.keystore
            git commit -m "ci: add stable Android signing keystore"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../track1st.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          version_code = 1200 + int(os.environ['GITHUB_RUN_NUMBER'])
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'versionCode': version_code,
                  'versionName': os.environ['VERSION'],
                  'apkUrl': 'https://github.com/Ph1lippus/Trackist/releases/download/android-latest/track1st.apk',
              }, f, separators=(',', ':'))
          PY
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            "track1st.apk" \
            "version.json" \
            --title "Track1st Android (latest)" \
            --notes "VERSION=${VERSION}
            Auto-built from the latest main branch. Download and open the APK on your Android phone to install Track1st."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: track1st-apk
          path: |
            track1st.apk
            version.json