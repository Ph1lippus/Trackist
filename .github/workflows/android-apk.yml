name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_B64 is missing. Add it under Settings > Secrets and variables > Actions (see README 'CI secrets')."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          echo "google-services.json restored"

      - name: Restore Android signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing. Add it under Settings > Secrets and variables > Actions (see README 'CI secrets')."
            exit 1
          fi
          mkdir -p android/app
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/upload.keystore
          echo "upload.keystore restored"

      - name: Set up .env for web build
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          HCAPTCHA_SITE_KEY: ${{ secrets.VITE_HCAPTCHA_SITE_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VITE_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          # TMDB is deliberately absent: the browser talks to the tmdb-proxy edge
          # function, which reads its key from the server-side environment. A
          # VITE_ key would be inlined into the public client bundle for nothing.
          #
          # Every value is validated before anything is written, so a missing
          # secret fails the job loudly instead of producing a .env with holes
          # that ships a broken app to users.
          missing=0
          entries=()
          for pair in \
            "VITE_SUPABASE_URL=$SUPABASE_URL" \
            "VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            "VITE_HCAPTCHA_SITE_KEY=$HCAPTCHA_SITE_KEY" \
            "VITE_PUSH_VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY"
          do
            if [ -z "${pair#*=}" ]; then
              echo "::error::Secret ${pair%%=*} is missing. Add it under Settings > Secrets and variables > Actions (see README 'CI secrets')."
              missing=1
            else
              entries+=("$pair")
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          {
            printf '%s\n' "${entries[@]}"
            # Feature flags, not credentials: kept inline so the build config
            # stays visible in the repository.
            echo "VITE_HCAPTCHA_ENABLED=true"
            echo "VITE_HIBP_ENABLED=true"
            echo "VITE_MFA_ENABLED=true"
          } > .env
          echo ".env written ($(wc -l < .env) lines)"

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Stamp version
        env:
          VERSION: 1.2.${{ github.run_number }}
        run: |
          export VERSION="1.2.${{ github.run_number }}"
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ['VERSION']
          app_gradle = Path('android/app/build.gradle')
          text = app_gradle.read_text()
          text = re.sub(r'versionName\s+"[^"]*"', f'versionName "{version}"', text)
          version_code = 1200 + int(os.environ['GITHUB_RUN_NUMBER'])
          text = re.sub(r'versionCode\s+\d+', f'versionCode {version_code}', text)
          app_gradle.write_text(text)
          PY

      - name: Build APK
        env:
          # Consumed by android/app/build.gradle's signingConfigs.releaseConfig.
          TRACK1ST_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${TRACK1ST_KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is missing."
            exit 1
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../track1st.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os
          version_code = 1200 + int(os.environ['GITHUB_RUN_NUMBER'])
          with open('version.json', 'w', encoding='utf-8') as f:
              json.dump({
                  'versionCode': version_code,
                  'versionName': os.environ['VERSION'],
                  'apkUrl': 'https://github.com/Ph1lippus/Trackist/releases/download/android-latest/track1st.apk',
              }, f, separators=(',', ':'))
          PY
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            "track1st.apk" \
            "version.json" \
            --title "Track1st Android (latest)" \
            --notes "VERSION=${VERSION}
            VERSION_CODE=$((1200 + GITHUB_RUN_NUMBER))
            Auto-built from the latest main branch. Download and open the APK on your Android phone to install Track1st."

      - name: Publish version.json to Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Uploading version.json to $SUPABASE_URL ..."
          RESPONSE=$(curl -sS -X POST \
            "$SUPABASE_URL/storage/v1/object/app-manifests/version.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "x-upsert: true" \
            --data-binary @version.json \
            -w "\nHTTP_STATUS:%{http_code}" 2>&1)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep -o 'HTTP_STATUS:[0-9]*' | tail -1 | cut -d: -f2)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Supabase upload failed with HTTP $STATUS"
            exit 1
          fi
          echo "version.json published to Supabase Storage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: track1st-apk
          path: |
            track1st.apk
            version.json