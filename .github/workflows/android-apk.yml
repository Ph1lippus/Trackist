name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check google-services.json present
        run: |
          test -f android/app/google-services.json || { echo "::error::android/app/google-services.json is missing - download it from Firebase and commit it"; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true; fi

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}

      - name: Setup .env for web build
        run: |
          tee .env >/dev/null <<'EOF'
          VITE_SUPABASE_URL=https://iqlzdmjamsvxinqbrnix.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_FtPjRxIb-H4GkM6u6ZX3JA_ZoiMV579
          VITE_TMDB_API_KEY=937ec79683c0989bab356844c93f8d2e
          VITE_HCAPTCHA_ENABLED=true
          VITE_HCAPTCHA_SITE_KEY=00a4a032-68c6-4600-8bbe-ff3a7bbcb7cc
          VITE_HIBP_ENABLED=true
          VITE_MFA_ENABLED=true
          VITE_PUSH_VAPID_PUBLIC_KEY=BEssU3Bgw1_Vky5PeIPOjPRESLb1orCsxycdUsZTM7Ve0nxeNcpaZQnjRURkrgIAYLquu4Am0vSPEkBZfEfFrCM
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Stamp version
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "VERSION=$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../track1st.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create android-latest \
            "track1st.apk" \
            --title "Track1st Android (latest)" \
            --notes "VERSION=${VERSION}
            Auto-built from the latest main branch. Download and open the APK on your Android phone to install Track1st."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: track1st-apk
          path: track1st.apk