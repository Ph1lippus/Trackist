<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trackist</title>
    <script>
        // Redirect all paths to index.html for SPA routing
        // This ensures client-side routing works on page refresh
        const search = window.location.search;
        const hash = window.location.hash;
        
        // Redirect to index.html (React Router will handle the actual route)
        // Don't append the path to avoid creating invalid URLs like /index.html/Page
        if (!window.location.pathname.includes('index.html')) {
            window.location.replace('/index.html' + search + hash);
        }
    </script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
